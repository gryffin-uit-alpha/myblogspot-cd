# ==============================================================================
# ARGOCD APPLICATION: MYBLOGSPOT (PRODUCTION)
# Repo: CD Config Repository
# Environment: Production
# Namespace: production
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myblogspot-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gryffin-uit-alpha/myblogspot-cd.git
    targetRevision: HEAD
    path: helm/myblogspot
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
