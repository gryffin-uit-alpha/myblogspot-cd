{{- if .Values.networkPolicy.enabled -}}
# ==============================================================================
# ZERO-TRUST KUBERNETES NETWORK POLICIES (INGRESS + EGRESS ISOLATION)
# Compatible with AWS ALB Controller (target-type: ip) & AWS RDS Subnets
# ==============================================================================

# 1. Default Deny All Ingress & Egress in Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myblogspot.fullname" . }}-default-deny-all
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Allow DNS Resolution (CoreDNS UDP/TCP 53) for All Pods in Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myblogspot.fullname" . }}-allow-dns-egress
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Allow AWS ALB & Kubelet Probes (VPC CIDR) + Prometheus Scraping to Workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myblogspot.fullname" . }}-allow-alb-and-probes-ingress
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["frontend", "backend"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr | default "10.100.0.0/16" }}
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
        - protocol: TCP
          port: {{ .Values.frontend.service.targetPort }}
---
# 4. Allow Frontend Pod <-> Backend Pod (Port 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myblogspot.fullname" . }}-frontend-to-backend
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
---
# 5. Allow Backend Pod -> AWS RDS PostgreSQL (5432) & AWS S3 / STS IRSA (443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myblogspot.fullname" . }}-backend-to-rds-egress
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.databaseSubnetCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
