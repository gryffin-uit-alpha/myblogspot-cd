{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default "aws-secretsmanager" }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.backend.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_USER: "{{ `{{ .db_username }}` }}"
        DB_PASSWORD: "{{ `{{ .db_password }}` }}"
        DB_URL: "postgresql://{{ `{{ .db_username }}` }}:{{ `{{ .db_password }}` }}@{{ .Values.backend.env.DB_HOST }}:{{ .Values.backend.env.DB_PORT }}/{{ .Values.backend.env.DB_NAME }}?sslmode={{ .Values.backend.env.DB_SSLMODE | default "require" }}"
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
        ADMIN_INITIAL_PASSWORD: "{{ `{{ .admin_password }}` }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: {{ .Values.externalSecrets.rdsSecretKey | quote }}
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.externalSecrets.rdsSecretKey | quote }}
        property: password
    - secretKey: jwt_secret
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretKey | quote }}
        property: jwt_secret
    - secretKey: admin_password
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretKey | quote }}
        property: admin_password
{{- else -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.backend.secrets.DB_URL | quote }}
  REDIS_URL: {{ .Values.backend.secrets.REDIS_URL | default "redis://myblogspot-redis:6379" | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
  DB_PASSWORD: {{ .Values.backend.secrets.DB_PASSWORD | quote }}
{{- end }}
