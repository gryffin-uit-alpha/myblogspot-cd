apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  labels:
    {{- include "myblogspot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.backend.secrets.DB_URL | default "postgres://myblogspot:secret-staging-password@myblogspot-postgres:5432/myblogspot_staging?sslmode=disable" | quote }}
  REDIS_URL: {{ .Values.backend.secrets.REDIS_URL | default "redis://myblogspot-redis:6379" | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | default "staging-jwt-secret-key-123456" | quote }}
  DB_PASSWORD: {{ .Values.backend.secrets.DB_PASSWORD | default "secret-staging-password" | quote }}
