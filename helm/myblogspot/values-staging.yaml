# Staging Environment Overrides
environment: staging

postgres:
  enabled: false

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "aws-secretsmanager"
    kind: "ClusterSecretStore"
  rdsSecretKey: "rds!db-b4ada19a-5596-4a9a-bc06-a177d1e950ac"
  appSecretKey: "staging/myblogspot/app-secrets"

backend:
  replicaCount: 1
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::736052310305:role/staging-myblogspot-backend-s3-role
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-backend
    tag: "8473fa728c1363ca7a3617daa3a86f2efae2aabf" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    PORT: "8080"
    ENV: "staging"
    LOG_LEVEL: "info"
    BASE_URL: "https://staging.hnblong.site"
    S3_BUCKET: "staging-myblogspot-uploads-736052310305"
    AWS_REGION: "ap-southeast-2"
    DB_HOST: "staging-myblogspot-postgres.czrn6lud72vp.ap-southeast-2.rds.amazonaws.com"
    DB_PORT: "5432"
    DB_NAME: "myblogspot_staging"
    DB_USER: "myblogspot_admin"
    DB_SSLMODE: "require"
    REDIS_ENABLED: "false"
    CORS_ALLOWED_ORIGINS: "https://staging.hnblong.site"
    ADMIN_INITIAL_USERNAME: "admin"
    ADMIN_INITIAL_EMAIL: "admin@hnblong.site"

frontend:
  replicaCount: 1
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-frontend
    tag: "06ea464791461909ce25cf94e8c13fe17a20a411" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  env:
    PORT: "3000"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: ""
    INTERNAL_API_URL: "http://myblogspot-staging-backend:8080"

ingress:
  enabled: true
  className: "alb"
  tls: []
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:736052310305:certificate/3c930980-2b2a-4338-85af-59a7a251ae0e
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
  hosts:
    - host: staging.hnblong.site
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /livez
          pathType: Exact
          service: backend
        - path: /readyz
          pathType: Exact
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

networkPolicy:
  enabled: true
  vpcCidr: "10.100.0.0/16"
  databaseSubnetCidrs:
    - "10.100.48.0/24"
    - "10.100.49.0/24"

hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

