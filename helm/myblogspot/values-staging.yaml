# Staging Environment Overrides
environment: staging
backend:
  replicaCount: 1
  image:
    tag: "5725eb360ada6a868760231e4ff49871bf0f7ccd" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
frontend:
  replicaCount: 1
  image:
    tag: "5725eb360ada6a868760231e4ff49871bf0f7ccd" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
ingress:
  hosts:
    - host: staging.hnblong.site
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /livez
          pathType: Exact
          service: backend
        - path: /readyz
          pathType: Exact
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: myblogspot-staging-tls
      hosts:
        - staging.hnblong.site
