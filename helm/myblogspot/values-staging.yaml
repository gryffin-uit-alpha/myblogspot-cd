# Staging Environment Overrides
environment: staging
postgres:
  enabled: true
  user: "myblogspot"
  password: "secret-staging-password"
  db: "myblogspot_staging"
backend:
  replicaCount: 1
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-backend
    tag: "e0b1aea4c9cb79a465dd1e2002d22499647931ec" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    PORT: "8080"
    ENV: "staging"
    LOG_LEVEL: "info"
    BASE_URL: "https://staging.hnblong.site"
    DB_HOST: "myblogspot-postgres"
    DB_PORT: "5432"
    DB_NAME: "myblogspot_staging"
    DB_USER: "myblogspot"
    DB_SSLMODE: "disable"
    REDIS_ENABLED: "false"
    CORS_ALLOWED_ORIGINS: "https://staging.hnblong.site"
    ADMIN_INITIAL_USERNAME: "admin"
    ADMIN_INITIAL_PASSWORD: "Admin@123456"
    ADMIN_INITIAL_EMAIL: "admin@hnblong.site"
  secrets:
    DB_URL: "postgresql://myblogspot:secret-staging-password@myblogspot-postgres:5432/myblogspot_staging?sslmode=disable"
    DB_PASSWORD: "secret-staging-password"
    REDIS_URL: "redis://myblogspot-redis:6379"
    JWT_SECRET: "staging-jwt-secret-key-123456"
frontend:
  replicaCount: 1
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-frontend
    tag: "e0b1aea4c9cb79a465dd1e2002d22499647931ec" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  env:
    PORT: "3000"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: ""
    INTERNAL_API_URL: "http://myblogspot-staging-backend:8080"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
  hosts:
    - host: staging.hnblong.site
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /livez
          pathType: Exact
          service: backend
        - path: /readyz
          pathType: Exact
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
networkPolicy:
  enabled: false
