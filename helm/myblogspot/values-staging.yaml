# Staging Environment Overrides
environment: staging

postgres:
  enabled: false

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "aws-secretsmanager"
    kind: "ClusterSecretStore"
  rdsSecretKey: "rds!db-fd8eb0c7-a365-4966-89e8-7667f8f8cc17"
  appSecretKey: "staging/myblogspot/app-secrets"

backend:
  replicaCount: 1
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-backend
    tag: "7e537a18671fe6ceafa6f6cdda62af9566dd9637" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    PORT: "8080"
    ENV: "staging"
    LOG_LEVEL: "info"
    BASE_URL: "https://staging.hnblong.site"
    DB_HOST: "staging-myblogspot-postgres.czrn6lud72vp.ap-southeast-2.rds.amazonaws.com"
    DB_PORT: "5432"
    DB_NAME: "myblogspot_staging"
    DB_USER: "myblogspot_admin"
    DB_SSLMODE: "require"
    REDIS_ENABLED: "false"
    CORS_ALLOWED_ORIGINS: "https://staging.hnblong.site"
    ADMIN_INITIAL_USERNAME: "admin"
    ADMIN_INITIAL_EMAIL: "admin@hnblong.site"

frontend:
  replicaCount: 1
  image:
    repository: 736052310305.dkr.ecr.ap-southeast-2.amazonaws.com/staging-myblogspot-frontend
    tag: "7e537a18671fe6ceafa6f6cdda62af9566dd9637" # Updated automatically by CI/CD GitOps
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  env:
    PORT: "3000"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: ""
    INTERNAL_API_URL: "http://myblogspot-staging-backend:8080"

ingress:
  enabled: true
  className: "alb"
  tls: []
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
  hosts:
    - host: staging.hnblong.site
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /livez
          pathType: Exact
          service: backend
        - path: /readyz
          pathType: Exact
          service: backend
        - path: /metrics
          pathType: Exact
          service: backend
        - path: /uploads
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

networkPolicy:
  enabled: false
